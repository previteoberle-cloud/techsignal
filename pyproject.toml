[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techsignal"
version = "0.5.0"
description = "Research-thesis impact assessment for hard-tech companies, on top of changedetection.io change data: rules, evidence ledger, bounded evidence gathering, Chinese research workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# R4 研究工作台（可选）。核心研判流水线不依赖它。
ui = ["streamlit>=1.40,<2"]

[project.scripts]
techsignal = "techsignal.cli:main"

[tool.setuptools.packages.find]
include = ["techsignal", "techsignal.*"]

[tool.setuptools.package-data]
"techsignal.workbench" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
