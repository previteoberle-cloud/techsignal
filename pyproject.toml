[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techsignal"
version = "0.1.0"
description = "Research-thesis impact assessment on top of changedetection.io change data (R1 research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
techsignal = "techsignal.cli:main"

[tool.setuptools.packages.find]
include = ["techsignal", "techsignal.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
